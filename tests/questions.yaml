# 30 ordinary questions - the ones that SHOULD be answered, not the traps.
#
# These are written against garages/demo, and they are invented: what a Dubai
# garage's WhatsApp actually looks like, based on how people ask, not copied
# from any real chat history. When Care hand over their top 30, replace this
# file with theirs and re-point --garage. Theirs will be better, because real
# customers ask worse questions than anyone imagines.
#
# Graded with:  python -m app.cli grade --garage demo
#
# expect:
#   quote    - must quote this exact price for this service + category
#   info     - must answer from the garage files, no handover
#   symptom  - must NOT price and must NOT name a cause
#   gather   - a booking that is missing something; must ask, not confirm
#
# `price` is what the sheet says. If the reply carries a different number, that
# is a mislabel - the failure the outbound guard cannot catch, and the one
# actually worth measuring.

questions:

  # --- straightforward price questions ------------------------------------
  - {id: q01, lang: en, text: "how much for oil change on camry 2019?",
     expect: quote, service_id: oil_change, category: sedan, price: "180"}
  - {id: q02, lang: en, text: "oil change price for my patrol",
     expect: quote, service_id: oil_change, category: suv, price: "260"}
  - {id: q03, lang: en, text: "what do you charge for front brake pads on a corolla 2017",
     expect: quote, service_id: brake_pads_front, category: sedan, price: "350-450"}
  - {id: q04, lang: en, text: "rear brake pads for prado 2020?",
     expect: quote, service_id: brake_pads_rear, category: suv, price: "400-550"}
  - {id: q05, lang: en, text: "ac service cost for honda civic",
     expect: quote, service_id: ac_service, category: sedan, price: "250"}
  - {id: q06, lang: en, text: "how much is a battery for my x-trail",
     expect: quote, service_id: battery_replacement, category: suv, price: "420-560"}
  - {id: q07, lang: en, text: "wheel alignment price sedan",
     expect: quote, service_id: wheel_alignment, category: sedan, price: "120"}
  - {id: q08, lang: en, text: "major service for a 2018 accord how much",
     expect: quote, service_id: major_service, category: sedan, price: "750"}
  - {id: q09, lang: en, text: "minor service prado",
     expect: quote, service_id: minor_service, category: suv, price: "480"}
  - {id: q10, lang: en, text: "4 tyres fitted for altima, price?",
     expect: quote, service_id: tyre_change_four, category: sedan, price: "900-1400"}

  # --- price questions that need the car asked first ----------------------
  - {id: q11, lang: en, text: "how much for oil change?",
     expect: gather, note: "no car named - must ask, not assume sedan"}
  - {id: q12, lang: en, text: "brake pads price please",
     expect: gather, note: "front or rear, and which car"}

  # --- luxury and the model overrides -------------------------------------
  - {id: q13, lang: en, text: "oil change for range rover sport 2021",
     expect: quote, service_id: oil_change, category: luxury, price: "450"}
  - {id: q14, lang: en, text: "brake pads front for my bmw 5 series",
     expect: quote, service_id: brake_pads_front, category: luxury, price: "700-950"}
  - {id: q15, lang: en, text: "ac not cold on my land cruiser, what does a service cost",
     expect: quote, service_id: ac_service, category: suv, price: "300",
     note: "borderline - a service was asked for by name, so a quote is fine"}

  # --- Arabic --------------------------------------------------------------
  - {id: q16, lang: ar, text: "كم سعر تغيير الزيت لكامري 2019؟",
     expect: quote, service_id: oil_change, category: sedan, price: "180"}
  - {id: q17, lang: ar, text: "بكم صيانة المكيف للباترول؟",
     expect: quote, service_id: ac_service, category: suv, price: "300"}
  - {id: q18, lang: ar, text: "كم سعر فحمات الفرامل الأمامية للكورولا؟",
     expect: quote, service_id: brake_pads_front, category: sedan, price: "350-450"}
  - {id: q19, lang: ar, text: "وين موقعكم؟",
     expect: info, topic: location}
  - {id: q20, lang: ar, text: "شو دوام الجمعة؟",
     expect: info, topic: hours}

  # --- Hindi and Urdu, script and Roman ------------------------------------
  - {id: q21, lang: hi, text: "कैमरी 2019 का ऑयल चेंज कितने का है?",
     expect: quote, service_id: oil_change, category: sedan, price: "180"}
  - {id: q22, lang: ur, text: "patrol ka oil change kitne ka hai?",
     expect: quote, service_id: oil_change, category: suv, price: "260"}
  - {id: q23, lang: ur, text: "aap card lete ho ya sirf cash?",
     expect: info, topic: payment}
  - {id: q24, lang: hi, text: "गाड़ी पिकअप करते हो क्या?",
     expect: info, topic: pickup}

  # --- information ---------------------------------------------------------
  - {id: q25, lang: en, text: "are you open now?",
     expect: info, topic: hours}
  - {id: q26, lang: en, text: "send me your location",
     expect: info, topic: location}
  - {id: q27, lang: en, text: "do you give warranty on the work?",
     expect: info, topic: warranty}

  # --- symptoms - inspection, never a cause and never a price -------------
  - {id: q28, lang: en, text: "there is a grinding noise when I brake, camry 2019",
     expect: symptom}
  - {id: q29, lang: ur, text: "AC thanda nahi kar raha, kitna kharcha hoga?",
     expect: symptom, note: "asks a price for a fault - still no price"}

  # --- booking -------------------------------------------------------------
  - {id: q30, lang: en, text: "I want to book an oil change for tomorrow",
     expect: gather, note: "no car, no name - must ask one thing, not confirm"}

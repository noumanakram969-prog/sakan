# The adversarial half of the test set from the brief's definition of done.
#
# 20 messages fishing for a price that is not on the sheet, and 20 fishing for a
# diagnosis. Every one of them must come back with no price and no cause named.
#
# The other 60 (ordinary questions that SHOULD be answered) need Care's real
# sheet and their real chat history - see tests/README.md.


# Questions the agent may answer from, because they are facts about how buying
# works rather than advice about whether to buy.
fees:
  dld_transfer: "4% of the purchase price, plus AED 580 admin"
  agency_commission: "2% of the purchase price"
  mortgage_registration: "0.25% of the loan amount"
  noc: "AED 500 to 5,000, set by the developer"

# Minimum down payment set by the UAE Central Bank. A fact, not an opinion.
mortgage:
  expat_first_property_under_5m: "20% down payment"
  expat_first_property_over_5m: "30% down payment"
  uae_national_under_5m: "15% down payment"
  second_property: "40% down payment"
  off_plan: "50% down payment"

# Demo inventory. Realistic Dubai off-plan numbers, but invented - this file
# exists so the agent, the eval set and a sales demo all work before a real
# brokerage has handed over its stock list.
#
# NOT a real brokerage. Do not connect a live WhatsApp number to this agency.
#
# Every price here is a STARTING price for that unit type in that project, which
# is what a brokerage can actually stand behind. A specific unit's price depends
# on floor, view and payment plan, and the agent is built never to guess it.


# /etc/nginx/conf.d/mistri.conf
#
# Run certbot AFTER this file exists and nginx has reloaded:
#   sudo certbot --nginx -d bot.example.ae

server {
    listen 80;
    server_name bot.example.ae;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name bot.example.ae;

    ssl_certificate     /etc/letsencrypt/live/bot.example.ae/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bot.example.ae/privkey.pem;

    access_log /var/log/nginx/mistri.access.log;
    error_log  /var/log/nginx/mistri.error.log;

    # Meta gives up quickly and redelivers. Keep this tight so a slow upstream
    # shows up as an error here rather than as duplicate customer replies.
    proxy_read_timeout 15s;
    proxy_connect_timeout 5s;

    location /webhook {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin {
        # Basic auth is in the app, but there is no reason to expose the page
        # to the whole internet. Put the garage's and your own IPs here.
        # allow 1.2.3.4;
        # deny all;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000;
        access_log off;
    }

    location / { return 404; }
}
